<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main>
      <section class="bg-slate-800">
        <div class="max-w-md min-h-screen bg-gray-200 mx-auto">
          <!-- header -->
          <header>
            <!-- navbar -->
            <nav
              class="md:flex justify-between items-center p-4 border-b-2 border-slate-400"
            >
              <div class="flex items-center gap-4">
                <div>
                  <img class="w-16" src="./assets/Group.png" alt="logo" />
                </div>
                <div>
                  <h3 class="text-2xl font-bold">$ 45000</h3>
                  <p>Available Balance</p>
                </div>
              </div>
              <div>
                <button class="btn mt-6 md:mt-0">Log-Out</button>
              </div>
            </nav>
          </header>
          <!-- transaction section -->
          <div class="mt-6 p-4">
            <h2 class="text-4xl font-bold">Welcome to Payooo!</h2>
            <p class="mt-3 text-slate-500">
              Enjoy easy and convenient financial services with us. Chasout
              charge is low
            </p>
            <div
              class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 mt-6"
            >
              <!-- add money -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/wallet1.png" alt="" />
                <p class="text-sm mt-2">Add Money</p>
              </div>
              <!-- cashout -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/send1.png" alt="" />
                <p class="text-sm mt-2">Cashout</p>
              </div>
              <!-- transfer money -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/money1.png" alt="" />
                <p class="text-sm mt-2">Transfer Money</p>
              </div>
              <!-- get bonus -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/bonus1.png" alt="" />
                <p class="text-sm mt-2">Get Bonus</p>
              </div>
              <!-- Pay bill -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/purse1.png" alt="" />
                <p class="text-sm mt-2">Pay Bill</p>
              </div>
              <!-- transaction -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/transaction1.png" alt="" />
                <p class="text-sm mt-2">Transactions</p>
              </div>
            </div>
            <!-- add money form -->
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
