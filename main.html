<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <main>
      <section class="bg-slate-800">
        <div class="max-w-md min-h-screen bg-gray-200 mx-auto">
          <!-- header -->
          <header>
            <!-- navbar -->
            <nav
              class="md:flex justify-between items-center p-4 border-b-2 border-slate-400"
            >
              <div class="flex items-center gap-4">
                <div>
                  <img class="w-16" src="./assets/Group.png" alt="logo" />
                </div>
                <div>
                  <h3 class="text-2xl font-bold">$ 45000</h3>
                  <p>Available Balance</p>
                </div>
              </div>
              <div>
                <button class="btn mt-6 md:mt-0">Log-Out</button>
              </div>
            </nav>
          </header>
          <!-- transaction section -->
          <div class="mt-6 p-4">
            <h2 class="text-4xl font-bold">Welcome to Payooo!</h2>
            <p class="mt-3 text-slate-500">
              Enjoy easy and convenient financial services with us. Chasout
              charge is low
            </p>
            <div
              class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 mt-6"
            >
              <!-- add money -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/wallet1.png" alt="" />
                <p class="text-sm mt-2">Add Money</p>
              </div>
              <!-- cashout -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/send1.png" alt="" />
                <p class="text-sm mt-2">Cashout</p>
              </div>
              <!-- transfer money -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/money1.png" alt="" />
                <p class="text-sm mt-2">Transfer Money</p>
              </div>
              <!-- get bonus -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/bonus1.png" alt="" />
                <p class="text-sm mt-2">Get Bonus</p>
              </div>
              <!-- Pay bill -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/purse1.png" alt="" />
                <p class="text-sm mt-2">Pay Bill</p>
              </div>
              <!-- transaction -->
              <div
                class="flex justify-center flex-col items-center p-4 rounded-xl border-2 border-slate-500 cursor-pointer"
              >
                <img class="w-10" src="./assets/transaction1.png" alt="" />
                <p class="text-sm mt-2">Transactions</p>
              </div>
            </div>
            <!-- add money form -->
            <div class="mt-8">
              <h3 class="text-4xl font-bold text-blue-600 mb-3">Add Money</h3>
              <div class="hero-content flex-col lg:flex-row-reverse">
                <div
                  class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl"
                >
                  <form class="card-body">
                    <fieldset class="fieldset">
                      <label class="label">Select A Bank</label>
                      <select class="input" name="" id="">
                        <legend>Select</legend>
                        <option value="Bkash">Bkash</option>
                        <option value="Nagad">Nagad</option>
                        <option value="DBBL">DBBL</option>
                      </select>
                      <label class="label">Bank Account Number</label>
                      <input
                        type="text"
                        class="input"
                        placeholder="Enter 11 digit Account Number"
                      />
                      <label class="label">Amount to Add</label>
                      <input
                        type="password"
                        class="input"
                        placeholder="Amount to Add"
                      />
                      <button
                        class="btn btn-neutral mt-4 bg-blue-600 text-gray-200 rounded-full border-none"
                      >
                        Add Money
                      </button>
                    </fieldset>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
