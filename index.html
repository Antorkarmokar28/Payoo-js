<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-800">
    <main>
      <section class="bg-gray-200 max-w-md min-h-screen mx-auto">
        <header>
          <nav class="flex justify-center items-center">
            <div class="relative mt-10 flex justify-center items-center">
              <img src="./assets/bg.png" alt="bg-img" />
              <img class="absolute" src="./assets/Group.png" alt="group-img" />
            </div>
          </nav>
        </header>
        <!-- login section -->
        <div class="hero">
            <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
              <div class="card-body">
                <fieldset class="fieldset">
                  <label class="label">Account Number</label>
                  <input type="text" class="input" placeholder="Enter your number" />
                  <label class="label">Password</label>
                  <input type="text" class="input" placeholder="Enter your PIN" />
                  <div><a class="link link-hover">Forgot password?</a></div>
                  <button class="btn btn-neutral mt-4">Login</button>
                </fieldset>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
